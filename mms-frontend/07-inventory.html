<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MMS — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-sunken:#EEF0F3; --border:#DFE3E8;
    --text:#1A2233; --text-muted:#5C6B7A; --text-faint:#8A96A5;
    --primary:#1F3B57; --primary-hover:#2C4F70; --primary-wash:#E7ECF1;
    --accent:#C77D2E; --accent-wash:#FBF0E2;
    --success:#2F8F5B; --success-wash:#E7F4ED;
    --warning:#C77D2E; --warning-wash:#FBF0E2;
    --danger:#C04A3D; --danger-wash:#F8EAE8;
    --info:#3B7A9E; --info-wash:#E9F1F5;
    --violet:#6A5ACD; --violet-wash:#ECEAFA;
    --radius-sm:6px; --radius-md:10px;
    --shadow-card: 0 1px 2px rgba(26,34,51,0.06), 0 1px 1px rgba(26,34,51,0.04);
    --sidebar-w: 240px;
  }
  html[data-theme="dark"]{
    --bg:#11161D; --surface:#171E27; --surface-sunken:#1D2530; --border:#2A3340;
    --text:#E8EBEF; --text-muted:#9AA7B5; --text-faint:#6B7684;
    --primary:#2C4F70; --primary-hover:#375F85; --primary-wash:#1E2A36;
    --accent:#D98A3D; --accent-wash:#2B2013;
    --success:#3FAE72; --success-wash:#16261C;
    --warning:#D98A3D; --warning-wash:#2B2013;
    --danger:#D9695A; --danger-wash:#2B1917;
    --info:#4F93B8; --info-wash:#17242C;
    --violet:#9B8FE0; --violet-wash:#211E35;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .25s ease, color .25s ease;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  .sidebar{width:var(--sidebar-w); flex-shrink:0; background:var(--primary); color:#fff; position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; transition:transform .25s ease, background-color .25s ease; z-index:40;}
  .brand{padding:22px 20px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.1);}
  .brand-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#1A1208;flex-shrink:0;}
  .brand-text{line-height:1.2;}
  .brand-text b{font-size:14.5px;font-weight:600;display:block;}
  .brand-text span{font-size:11.5px;color:rgba(255,255,255,0.55);}
  nav.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-sm); color:rgba(255,255,255,0.68); font-size:13.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:background .15s, color .15s;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.12); color:#fff;}
  .nav-item.active svg{color:var(--accent); opacity:1;}
  .nav-item.disabled{opacity:.42; cursor:not-allowed; pointer-events:none;}
  .nav-soon{margin-left:auto; font-size:9.5px; font-weight:700; letter-spacing:.3px; background:rgba(255,255,255,0.1); padding:1.5px 6px; border-radius:10px; color:rgba(255,255,255,0.6);}
  .sidebar-foot{padding:14px 20px 18px; font-size:11px; color:rgba(255,255,255,0.4); border-top:1px solid rgba(255,255,255,0.1);}

  .main{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{height:64px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:20; transition:background-color .25s ease, border-color .25s ease;}
  .topbar-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .hamburger{display:none; background:none; border:none; cursor:pointer; padding:6px; margin-left:-6px;}
  .hamburger svg{width:20px;height:20px;color:var(--text);}
  .crumb{font-size:12.5px; color:var(--text-faint);}
  .page-title-top{font-size:16px; font-weight:600; margin:1px 0 0;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .bell-btn{position:relative; background:none; border:none; cursor:pointer; padding:7px; border-radius:var(--radius-sm); color:var(--text-muted);}
  .bell-btn:hover{background:var(--surface-sunken);}
  .bell-btn svg{width:18px;height:18px;display:block;}
  .theme-btn svg{transition:transform .3s ease;}
  .theme-btn:active svg{transform:rotate(25deg);}
  .bell-dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface);}
  .user-chip{display:flex; align-items:center; gap:9px; padding-left:16px; border-left:1px solid var(--border);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-wash);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .user-meta{line-height:1.25;}
  .user-meta b{font-size:13px; font-weight:600; display:block;}
  .role-badge{display:inline-block; margin-top:1px; font-size:10px; font-weight:600; color:var(--info); background:var(--info-wash); padding:1px 7px; border-radius:20px;}

  .content{padding:26px 28px 60px; max-width:1180px; width:100%; margin:0 auto;}
  .content-head{margin-bottom:20px; animation:fadeUp .35s ease both;}
  .content-head h1{font-size:21px; font-weight:700; margin:0 0 4px;}
  .content-head p{font-size:13.5px; color:var(--text-muted); margin:0;}

  .error-banner{background:var(--danger-wash); color:var(--danger); border:1px solid var(--danger); border-radius:var(--radius-md); padding:12px 16px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .error-banner svg{width:16px;height:16px; flex-shrink:0;}
  .skeleton{background:var(--surface-sunken); border-radius:var(--radius-md); animation:pulse 1.4s ease-in-out infinite;}
  .skel-strip{height:60px;}
  .skel-row{height:48px; border-bottom:1px solid var(--border);}

  .notwired{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-md); padding:40px 28px; text-align:center; animation:fadeUp .4s ease both;}
  .notwired .nw-icon{width:40px; height:40px; border-radius:50%; background:var(--primary-wash); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .notwired .nw-icon svg{width:19px;height:19px;}
  .notwired h3{font-size:15px; margin:0 0 6px;}
  .notwired p{font-size:13px; color:var(--text-muted); margin:0 0 4px; max-width:440px; margin-left:auto; margin-right:auto; line-height:1.5;}
  .notwired code{font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--surface-sunken); padding:2px 7px; border-radius:5px; color:var(--text);}

  .stat-strip{display:flex; gap:12px; margin-bottom:20px;}
  .strip-card{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-card); animation:fadeUp .4s ease both; transition:background-color .25s ease, border-color .25s ease;}
  .strip-card b{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; display:block;}
  .strip-card span{font-size:12px; color:var(--text-muted);}
  .strip-card.healthy b{color:var(--success);}
  .strip-card.low b{color:var(--warning);}
  .strip-card.out b{color:var(--danger);}

  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-card); transition:background-color .25s ease, border-color .25s ease; animation:fadeUp .4s ease both;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:11px; font-weight:600; color:var(--text-faint); background:var(--surface-sunken); padding:11px 16px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--border); transition:background-color .12s ease;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--surface-sunken);}
  tbody td{padding:12px 16px; vertical-align:middle;}
  .material-cell{font-weight:500;}
  .qty-cell{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .status-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; width:fit-content;}
  .status-chip .d{width:6px;height:6px;border-radius:50%;}
  .s-healthy{background:var(--success-wash); color:var(--success);}
  .s-healthy .d{background:var(--success);}
  .s-low{background:var(--warning-wash); color:var(--warning);}
  .s-low .d{background:var(--warning);}
  .s-out{background:var(--danger-wash); color:var(--danger);}
  .s-out .d{background:var(--danger);}
  .incoming-badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--info); font-weight:600;}
  .incoming-badge svg{width:12px;height:12px;}

  .empty-state{padding:50px 20px; text-align:center;}
  .empty-state svg{width:36px;height:36px; color:var(--text-faint); margin-bottom:10px;}
  .empty-state h3{font-size:14px; margin:0 0 4px;}
  .empty-state p{font-size:12.5px; color:var(--text-muted); margin:0;}

  .mobile-cards{display:none;}
  .mcard{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .mcard:last-child{border-bottom:none;}
  .mcard-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .mcard-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);}

  .scrim{display:none; position:fixed; inset:0; background:rgba(15,20,25,0.4); z-index:30;}
  @media (max-width: 768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .hamburger{display:inline-flex;}
    .scrim.show{display:block;}
    .user-meta{display:none;}
    .content{padding:18px 14px 50px;}
    .stat-strip{flex-wrap:wrap;}
    .table-wrap table{display:none;}
    .mobile-cards{display:block;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="scrim" :class="{show: sidebarOpen}" @click="sidebarOpen=false"></div>

  <aside class="sidebar" :class="{open: sidebarOpen}">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text"><b>Material Mgmt</b><span>System</span></div>
    </div>
    <nav class="nav">
      <a class="nav-item" :class="{active: item.label === 'Inventory', disabled: !item.href}" :href="item.href || null" v-for="item in navItems" :key="item.label">
        <span v-html="item.icon"></span>{{ item.label }}
        <span class="nav-soon" v-if="!item.href">Soon</span>
      </a>
    </nav>
    <div class="sidebar-foot">v0.1 prototype — Webential</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" @click="sidebarOpen=true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <div class="crumb">Stock</div>
          <div class="page-title-top">Inventory</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="bell-btn theme-btn" @click="toggleTheme" :title="darkMode ? 'Switch to light' : 'Switch to dark'">
          <svg v-if="!darkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
          <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="bell-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="bell-dot"></span>
        </button>
        <div class="user-chip">
          <div class="avatar">HP</div>
          <div class="user-meta"><b>Het Patel</b><span class="role-badge">Purchase Supervisor</span></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="content-head">
        <h1>Inventory</h1>
        <p>Current stock across all tracked materials.</p>
      </div>

      <div class="error-banner" v-if="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Couldn't reach the API at {{ apiBase }} — {{ error }}.
      </div>

      <template v-if="loading">
        <div class="stat-strip">
          <div class="skeleton skel-strip" style="flex:1;"></div>
          <div class="skeleton skel-strip" style="flex:1;"></div>
          <div class="skeleton skel-strip" style="flex:1;"></div>
        </div>
        <div class="skeleton skel-row" v-for="n in 6" :key="n"></div>
      </template>

      <template v-else>
        <div class="stat-strip">
          <div class="strip-card"><b>{{ summaryCounts.skus }}</b><span>Tracked SKUs</span></div>
          <div class="strip-card healthy"><b>{{ summaryCounts.healthy }}</b><span>Healthy stock</span></div>
          <div class="strip-card low"><b>{{ summaryCounts.low }}</b><span>Running low</span></div>
          <div class="strip-card out"><b>{{ summaryCounts.out }}</b><span>Out of stock</span></div>
        </div>

        <div class="notwired" v-if="notWired">
          <div class="nw-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
          </div>
          <h3>Stock list not wired yet</h3>
          <p>The counts above come from your existing <code>/api/dashboard/summary</code>, but the full per-material breakdown expects <code>GET {{ apiBase }}/api/inventory</code>, which doesn't exist yet. Build it and the table below populates automatically.</p>
        </div>

        <template v-else>
          <div class="table-wrap">
            <table v-if="items.length">
              <thead>
                <tr><th>Material</th><th>Unit</th><th>Available</th><th>Incoming</th><th>Status</th></tr>
              </thead>
              <tbody>
                <tr v-for="it in items" :key="it._id">
                  <td class="material-cell">{{ it.material }}</td>
                  <td style="color:var(--text-muted); font-size:12.5px;">{{ it.unit }}</td>
                  <td class="qty-cell">{{ it.available }}</td>
                  <td>
                    <span class="incoming-badge" v-if="it.incoming > 0">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                      {{ it.incoming }}
                    </span>
                    <span v-else style="color:var(--text-faint); font-size:12.5px;">—</span>
                  </td>
                  <td><span class="status-chip" :class="'s-' + it.statusKey"><span class="d"></span>{{ it.statusLabel }}</span></td>
                </tr>
              </tbody>
            </table>

            <div class="mobile-cards" v-if="items.length">
              <div class="mcard" v-for="it in items" :key="it._id">
                <div class="mcard-top">
                  <b style="font-size:13.5px;">{{ it.material }}</b>
                  <span class="status-chip" :class="'s-' + it.statusKey"><span class="d"></span>{{ it.statusLabel }}</span>
                </div>
                <div class="mcard-meta">
                  <span>Available: {{ it.available }} {{ it.unit }}</span>
                  <span v-if="it.incoming > 0">Incoming: {{ it.incoming }}</span>
                </div>
              </div>
            </div>

            <div class="empty-state" v-if="!items.length">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
              <h3>No inventory records</h3>
              <p>Stock will appear here once materials are received.</p>
            </div>
          </div>
        </template>
      </template>
    </main>
  </div>
</div>

<script>
const { createApp } = Vue;
const icons = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  requests: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>',
  verify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg>',
  approval: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
  receiving: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>',
  inventory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>',
  conversion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>'
};

// Change this if your FastAPI server runs elsewhere (or set window.MMS_API_BASE before this script runs).
const API_BASE = window.MMS_API_BASE || 'http://localhost:8000';

createApp({
  data(){
    return {
      apiBase: API_BASE,
      sidebarOpen: false,
      darkMode: false,
      loading: true,
      error: null,
      notWired: false,
      navItems: [
        { label: 'Dashboard', icon: icons.home, href: '01-dashboard.html' },
        { label: 'Material Requests', icon: icons.requests, href: '02-material-requests.html' },
        { label: 'Receiver Verification', icon: icons.verify, href: '04-receiver-verification.html' },
        { label: 'Purchase Approval', icon: icons.approval, href: '03-purchase-approval.html' },
        { label: 'Purchase Orders', icon: icons.orders, href: '05-purchase-orders.html' },
        { label: 'Material Receiving', icon: icons.receiving, href: '06-material-receiving.html' },
        { label: 'Inventory', icon: icons.inventory, href: '07-inventory.html' },
        { label: 'Material Conversion', icon: icons.conversion, href: '08-conversion.html' },
      ],
      summaryCounts: { skus: 0, healthy: 0, low: 0, out: 0 },  // from your existing /api/dashboard/summary
      items: []  // populated only from a real /api/inventory response — never mock data
    }
  },
  mounted(){
    this.fetchAll();
  },
  methods: {
    toggleTheme(){
      this.darkMode = !this.darkMode;
      document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
    },
    mapItem(it){
      // Field names are a best guess at REST convention — adjust once the real endpoint exists.
      const available = Number(it.available_quantity ?? it.quantity ?? 0);
      const incoming = Number(it.incoming_quantity ?? 0);
      let statusKey = 'healthy', statusLabel = 'Healthy';
      if (available <= 0) { statusKey = 'out'; statusLabel = 'Out of Stock'; }
      else if (it.low_stock_threshold && available <= it.low_stock_threshold) { statusKey = 'low'; statusLabel = 'Running Low'; }
      else if (!it.low_stock_threshold && available < 10) { statusKey = 'low'; statusLabel = 'Running Low'; }
      return {
        _id: it.id || it.material_id,
        material: it.material_name || it.material || '—',
        unit: it.unit || '',
        available, incoming, statusKey, statusLabel
      };
    },
    async fetchAll(){
      this.loading = true;
      this.error = null;
      this.notWired = false;
      try {
        // Counts are real today — your dashboard/summary endpoint already returns these.
        const summaryRes = await fetch(`${API_BASE}/api/dashboard/summary`);
        if (!summaryRes.ok) throw new Error(`dashboard/summary returned ${summaryRes.status}`);
        const summary = await summaryRes.json();
        this.summaryCounts = summary.inventory || this.summaryCounts;

        // Per-material breakdown is not implemented on the backend yet.
        const invRes = await fetch(`${API_BASE}/api/inventory`);
        if (invRes.status === 404) { this.notWired = true; return; }
        if (!invRes.ok) throw new Error(`inventory returned ${invRes.status}`);
        const data = await invRes.json();
        this.items = (Array.isArray(data) ? data : data.items || []).map(this.mapItem);
      } catch (err) {
        this.error = err.message || 'request failed';
      } finally {
        this.loading = false;
      }
    }
  }
}).mount('#app');
</script>
</body>
</html>
